<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MSQ-8 Synth</title>
<style>
:root {
  --bg: #0a0c16;
  --panel: #12172a;
  --key: #1b2238;
  --key-edge: #2c3556;
  --text: #c8d2e6;
  --dim: #6e7896;
  --amber: #ffbe28;
  --green: #50dc78;
  --red: #e64646;
  --white-key: #e9edf6;
  color-scheme: dark;
  --black-key: #151a2c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}

#app {
  max-width: 520px;
  margin: 0 auto;
  padding-block: max(8px, env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-inline: 16px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 0 8px;
}
.brand { font-size: 17px; letter-spacing: .06em; }
.brand b { color: var(--amber); }
#ver { color: var(--dim); font-size: 11px; margin-left: 4px; }
.tag { color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
[hidden] { display: none !important; }

.btn {
  appearance: none;
  -webkit-appearance: none;
  min-height: 46px;
  padding: 6px 4px;
  background: var(--key);
  border: 1px solid var(--key-edge);
  border-radius: 9px;
  color: var(--text);
  font: inherit;
  font-size: 12px;
  letter-spacing: .02em;
  touch-action: none;
  cursor: pointer;
}
.btn.small { min-height: 34px; padding: 4px 11px; font-size: 11px; }
.btn.on, .btn:active { background: #3a3220; border-color: var(--amber); color: var(--amber); }
.btn.latched { background: #3a3220; border-color: var(--amber); color: var(--amber); }
.btn.live { background: #17382a; border-color: var(--green); color: var(--green); }
.btn.rec { background: #3c1a1e; border-color: var(--red); color: var(--red); }
.btn.tab-active { background: var(--amber); border-color: var(--amber); color: #1a1405; }
.btn.warn { background: #3c1a1e; border-color: var(--red); color: var(--red); }

#screenwrap { position: relative; }
#screen {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  image-rendering: pixelated;
  background: #000;
  border-radius: 8px;
  border: 1px solid var(--key-edge);
}
#start {
  position: absolute;
  inset: 0;
  width: 100%;
  border: 0;
  border-radius: 8px;
  background: rgba(10, 12, 22, .82);
  color: var(--amber);
  font: 700 22px/1 system-ui, sans-serif;
  letter-spacing: .12em;
}
#start.hidden { display: none; }

.row { display: grid; gap: 6px; margin-top: 8px; }
#pages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
#transport { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }

#nav { display: grid; grid-template-columns: 1fr 96px; gap: 8px; margin-top: 8px; align-items: stretch; }
#dpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 50px);
  gap: 6px;
}
#dpad .btn { min-height: 0; font-size: 18px; }
#mods { display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 6px; }

#shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
#shortcuts .btn { font-size: 11px; line-height: 1.15; }
#shortcuts .btn small { display: block; color: var(--dim); font-weight: 500; font-size: 9px; margin-top: 2px; }
#shortcuts .btn.on small { color: var(--amber); }

#keys { margin-top: 10px; }
#pianobar { display: grid; grid-template-columns: 70px 1fr 70px; gap: 6px; align-items: center; margin-bottom: 6px; }
#pianobar .mid { text-align: center; color: var(--dim); font-size: 11px; }
#pianobar .btn { min-height: 34px; }

#piano {
  position: relative;
  display: flex;
  height: 132px;
  touch-action: none;
}
.white {
  flex: 1;
  background: var(--white-key);
  border: 1px solid #9aa3bd;
  border-radius: 0 0 6px 6px;
  color: #707a96;
  font-size: 9px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  touch-action: none;
}
.white.on { background: var(--amber); color: #1a1405; }
.black {
  position: absolute;
  top: 0;
  height: 62%;
  width: 5.4%;
  background: var(--black-key);
  border: 1px solid #000;
  border-radius: 0 0 5px 5px;
  z-index: 2;
  touch-action: none;
}
.black.on { background: var(--amber); }

#pads, #stutters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#pads { display: none; }
#pads .label { grid-column: 1 / -1; color: var(--dim); font-size: 10px; letter-spacing: .1em; margin: 6px 0 -2px; }
#pads .btn { min-height: 58px; font-size: 12px; }
.pad0 { border-bottom: 4px solid #eb5046; }
.pad1 { border-bottom: 4px solid #f0963c; }
.pad2 { border-bottom: 4px solid #ebd746; }
.pad3 { border-bottom: 4px solid #eb6eaa; }
.pad4 { border-bottom: 4px solid #50d2dc; }
.pad5 { border-bottom: 4px solid #5a82f0; }
.pad6 { border-bottom: 4px solid #6edc78; }
.pad7 { border-bottom: 4px solid #b478f0; }
.stut { border-top: 3px solid var(--red); }

.hint { color: var(--dim); font-size: 10px; font-weight: 500; margin: 12px 2px 0; line-height: 1.4; }

@media (min-width: 700px) {
  #app { max-width: 560px; }
}

#project { margin-top: 14px; }
#project .label { color: var(--dim); font-size: 10px; letter-spacing: .1em; margin-bottom: 6px; }
#autosaved { color: var(--dim); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
#projbtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
#projbtns .btn { padding-inline: 2px; font-size: 10px; }
#pastebox { display: grid; gap: 6px; margin-top: 8px; }
#code {
  width: 100%;
  min-width: 0;
  resize: vertical;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--key-edge);
  border-radius: 8px;
  padding: 8px;
  font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
  -webkit-user-select: text;
  user-select: text;
}

/* ---------------------------------------------------------------- the front panel view */
.views { display: flex; gap: 6px; }
#panelview { margin-top: 4px; }
#stage { position: relative; width: 100%; overflow: hidden; }
#device {
  position: absolute;
  top: 0;
  width: 600px;
  height: 1056px;
  transform-origin: 0 0;
  background: linear-gradient(180deg, #1b2036 0%, #101424 55%, #0c0f1c 100%);
  border-radius: 22px;
  box-shadow: inset 0 0 0 2px #2a3150, inset 0 2px 0 #3a4268, 0 12px 30px rgba(0, 0, 0, .5);
}
#device > * { position: absolute; }
.legend {
  color: #7d88a8;
  font: 600 10px/12px system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
  white-space: nowrap;
  pointer-events: none;
}
.legend.logo { font: 800 30px/34px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .12em; color: var(--amber); }

.bezel { background: #04050a; border: 1px solid #2c3556; border-radius: 12px; box-shadow: inset 0 0 0 4px #0b0e1a, 0 1px 0 #3a4268; }
.bezel canvas { position: absolute; width: 300px; height: 300px; image-rendering: pixelated; border-radius: 4px; background: #000; }
.pstart {
  position: absolute;
  inset: 8px;
  border: 0;
  border-radius: 6px;
  background: rgba(10, 12, 22, .85);
  color: var(--amber);
  font: 700 20px/1 system-ui, sans-serif;
  letter-spacing: .12em;
}
.pstart.hidden { display: none; }

.pbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
  text-align: center;
  padding: 2px;
  background: linear-gradient(#2a3150, #1a2036);
  border: 1px solid #38426a;
  border-radius: 8px;
  color: #d6deef;
  font: 700 11px/1.1 system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: .05em;
  box-shadow: 0 3px 0 #090b16, inset 0 1px 0 #3b4670;
  touch-action: none;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.pbtn.on { transform: translateY(2px); box-shadow: 0 1px 0 #090b16; border-color: var(--amber); color: var(--amber); }
.pbtn.latched { border-color: var(--amber); color: var(--amber); background: linear-gradient(#3a3220, #2a2416); }
.pbtn.warn { color: var(--red); }
.pbtn.empty { opacity: .28; pointer-events: none; }
.pbtn.more { font-size: 10px; color: #9aa6c6; }
.pbtn.dp { font-size: 16px; }
.pbtn .leg { pointer-events: none; }
.pbtn .hint { color: #7d88a8; font-weight: 500; font-size: 9px; letter-spacing: .02em; pointer-events: none; }
.pbtn .led { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #262d4a; pointer-events: none; }
.pbtn.green .led.lit { background: var(--green); box-shadow: 0 0 7px var(--green); }
.pbtn.red .led.lit { background: var(--red); box-shadow: 0 0 7px var(--red); }
.pbtn.amber .led.lit { background: var(--amber); box-shadow: 0 0 7px var(--amber); }
.pbtn { position: absolute; }

.knob, .wheel { touch-action: none; cursor: ns-resize; -webkit-user-select: none; user-select: none; }
.wheel { cursor: ew-resize; }
.knob svg, .wheel svg { display: block; width: 100%; height: 100%; overflow: visible; }
.kb { fill: #0e1222; stroke: #3b4568; stroke-width: 2; }
.hi { fill: #181e36; stroke: #2a3354; stroke-width: 1; }
.tick { stroke: #56608c; stroke-width: 2; }
.ptr { stroke: var(--amber); stroke-width: 5; stroke-linecap: round; }
.dot { fill: var(--amber); }
.klabel {
  text-align: center;
  font: 600 10px/1.15 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #a9b4d2;
  letter-spacing: .08em;
  text-transform: uppercase;
  pointer-events: none;
}

.pkeys { display: flex; touch-action: none; }
.pkeys .white { height: 124px; }
.pkeys .black { height: 76px; width: 22px; }
.ppads { display: grid; grid-template-columns: repeat(4, 134px); grid-template-rows: 54px 54px 22px 54px 54px; gap: 6px; touch-action: none; }
.ppads .legend { align-self: end; }
.ppad {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#2a3150, #1a2036);
  border: 1px solid #38426a;
  border-radius: 8px;
  color: #d6deef;
  font: 700 13px/1 system-ui, sans-serif;
  letter-spacing: .06em;
  box-shadow: 0 3px 0 #090b16;
  touch-action: none;
  cursor: pointer;
}
.ppad.on { transform: translateY(2px); box-shadow: none; color: var(--amber); border-color: var(--amber); }

/* the SQ-80 theme: the page takes the screen's electric blue */
body.sq80 { --amber: #4f9bff; --green: #7ec0ff; --red: #d7ebff; --dim: #3b6cb8; --text: #9cc8ff; --key-edge: #1f3d73; --panel: #070d1c; }
body.sq80 .btn.on, body.sq80 .btn:active, body.sq80 .btn.latched { background: #0d2247; }
body.sq80 .btn.tab-active { color: #02060f; }
body.sq80 .ptr, body.sq80 .dot { stroke: #4f9bff; fill: #4f9bff; }
body.sq80 .ptr { fill: none; }
body.sq80 .pad0, body.sq80 .pad1, body.sq80 .pad2, body.sq80 .pad3, body.sq80 .pad4, body.sq80 .pad5, body.sq80 .pad6, body.sq80 .pad7 { border-bottom-color: #3a78d8; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>MSQ-8</b> <span id="ver"></span></div>
    <div class="views" role="group" aria-label="View">
      <button class="btn small" id="btnTheme" type="button">THEME</button>
      <button class="btn small" id="vPanel" type="button">PANEL</button>
      <button class="btn small" id="vTouch" type="button">TOUCH</button>
    </div>
  </header>

  <div id="touchview">
    <div id="screenwrap">
      <canvas id="screen" width="240" height="240"></canvas>
      <button class="js-start" id="start" type="button">TAP TO START</button>
    </div>

    <nav id="pages" aria-label="Pages"></nav>

    <section id="transport" aria-label="Transport"></section>

    <section id="nav" aria-label="Navigation">
      <div id="dpad"></div>
      <div id="mods"></div>
    </section>

    <section id="shortcuts" aria-label="Raccourcis"></section>

    <section id="keys" aria-label="Clavier">
      <div id="pianobar"></div>
      <div id="piano"></div>
      <div id="pads"></div>
    </section>
  </div>

  <div id="panelview" hidden>
    <div id="stage"><div id="device"></div></div>
  </div>

  <section id="project" aria-label="Projet">
    <div class="label">PROJECT <span id="autosaved">kept in this browser</span></div>
    <div id="projbtns">
      <button class="btn small" id="btnSave" type="button">SAVE FILE</button>
      <button class="btn small" id="btnLoad" type="button">LOAD FILE</button>
      <button class="btn small" id="btnCopy" type="button">COPY CODE</button>
      <button class="btn small" id="btnPaste" type="button">PASTE CODE</button>
      <button class="btn small" id="btnNew" type="button">NEW</button>
    </div>
    <div id="pastebox" hidden>
      <textarea id="code" rows="4" spellcheck="false" autocomplete="off" placeholder="Paste a project code here"></textarea>
      <button class="btn small" id="btnCodeLoad" type="button">LOAD THIS CODE</button>
    </div>
  </section>

  <p class="hint">PC: Z S X D C V G B H N J M play, Q 2 W 3 E R 5 T… an octave up. Arrows, Space, F1-F11, Ctrl+S / Ctrl+O.</p>
  <input type="file" id="file" accept=".msq8,.txt,application/octet-stream,text/plain" hidden>

<script>
/* The front panel of the MSQ-8, drawn as the device: the screen, MASTER and four knobs that change their job with the page,
   transport and page buttons with their lights, eight function buttons whose legends follow the page, a d-pad and a DATA
   wheel, a keybed (the 8 pads and 8 stutters take its place on the drum pages). It sits on the engine's own commands, like
   the touch view: this file only draws the box and sends the same keys. app.js calls msqPanelInit when it starts. */
(function () {
  'use strict';

  var DESIGN_W = 600, H_KEYS = 1056, H_PADS = 1210;
  var VIEW_KEY = 'msq8-view';

  window.msqPanelInit = function (A) {
    var mk = A.mk, K = A.K, F = A.F, PAGE = A.PAGE;
    var dev = A.$('device'), stage = A.$('stage'), panelView = A.$('panelview'), touchView = A.$('touchview');
    var leds = [], knobs = [], master = null, wheel = null, curH = H_KEYS, shown = -1, softEls = [], softIdx = {}, more = null;
    var keysBox = null, padsBox = null;

    function X() { return A.exports(); }

    function place(el, x, y, w, h) {
      el.style.left = x + 'px'; el.style.top = y + 'px';
      if (w) el.style.width = w + 'px';
      if (h) el.style.height = h + 'px';
      dev.appendChild(el);
      return el;
    }

    function legend(text, x, y, w) {
      var d = mk('div', 'legend', text);
      d.style.width = (w || 300) + 'px';
      return place(d, x, y);
    }

    function cstr(ptr) {
      var m = new Uint8Array(X().memory.buffer, ptr, 40), s = '', i;
      for (i = 0; i < 40 && m[i]; ++i) s += String.fromCharCode(m[i]);
      return s;
    }

    // a key of the engine, sent with the given modifiers
    function send(key, sh, ct) { return function (r) { A.key(key, sh, ct, r); }; }

    function lamp(el, test, color) {
      var i = mk('i', 'led');
      if (color) el.classList.add(color);
      el.appendChild(i);
      leds.push({ el: i, test: test });
    }

    function pbtn(label, x, y, w, h, down, rep, test, color) {
      var b = mk('div', 'pbtn');
      b.appendChild(mk('span', 'leg', label));
      if (test) lamp(b, test, color);
      A.press(b, down, null, !!rep);
      return place(b, x, y, w, h);
    }

    // ---------------------------------------------------------------- knobs
    function knobSvg(extra) {
      var ticks = '', i;
      for (i = 0; i <= 10; ++i) ticks += '<line class="tick" x1="0" y1="-45" x2="0" y2="-49" transform="rotate(' + (-135 + 27 * i) + ')"/>';
      return '<svg viewBox="-50 -50 100 100" aria-hidden="true">' + ticks + '<circle class="kb" r="38"/>' + extra + '</svg>';
    }

    // a pot: dragged up or down (or turned with the mouse wheel) it makes detents; its pointer shows `value`
    function makeKnob(cx, cy, r, turn) {
      var el = mk('div', 'knob'), ptr, acc = 0, last = 0, active = false;
      el.innerHTML = knobSvg('<circle class="hi" r="30"/><line class="ptr" x1="0" y1="-10" x2="0" y2="-33"/>');
      ptr = el.querySelector('.ptr');
      place(el, cx - r, cy - r, 2 * r, 2 * r);
      el.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        active = true; last = ev.clientY; acc = 0;
        try { el.setPointerCapture(ev.pointerId); } catch (e) { /* ok */ }
        A.ensureAudio();
      });
      el.addEventListener('pointermove', function (ev) {
        if (!active) return;
        acc += last - ev.clientY; last = ev.clientY;
        var n = acc < 0 ? Math.ceil(acc / 4) : Math.floor(acc / 4);
        if (n) { acc -= n * 4; turn(n); }
      });
      function end() { active = false; }
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('wheel', function (ev) { ev.preventDefault(); turn(ev.deltaY < 0 ? 1 : -1); }, { passive: false });
      return {
        el: el, label: null, shown: -1,
        set: function (v) {
          var a = Math.round(-135 + 270 * v);
          if (a !== this.shown) { this.shown = a; ptr.setAttribute('transform', 'rotate(' + a + ')'); }
        }
      };
    }

    function buildKnobs() {
      var spots = [[410, 158], [530, 158], [410, 290], [530, 290]], k;
      for (k = 0; k < 4; ++k) (function (n) {
        var kn = makeKnob(spots[n][0], spots[n][1], 32, function (d) { X().msq_web_knob(n, d); });
        kn.label = mk('div', 'klabel', 'KNOB ' + (n + 1));
        kn.label.style.width = '116px';
        place(kn.label, spots[n][0] - 58, spots[n][1] + 38);
        knobs.push(kn);
      })(k);
      master = makeKnob(548, 42, 24, function (d) { X().msq_web_master(d); });
      legend('MASTER', 446, 36, 74).style.textAlign = 'right';
    }

    // ---------------------------------------------------------------- DATA wheel (a left / right)
    function buildWheel() {
      var el = mk('div', 'wheel'), notches = '', i, acc = 0, last = 0, angle = 0, active = false, sh = false, ct = false;
      for (i = 0; i < 24; ++i) notches += '<line class="tick" x1="0" y1="-43" x2="0" y2="-49" transform="rotate(' + (i * 15) + ')"/>';
      el.innerHTML = '<svg viewBox="-50 -50 100 100" aria-hidden="true"><g class="spin">' + notches + '<circle class="kb" r="38"/><circle class="dot" cx="0" cy="-27" r="4"/></g></svg>';
      var spin = el.querySelector('.spin');
      place(el, 408, 738, 124, 124);
      el.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        active = true; last = ev.clientX; acc = 0;
        sh = A.mods.shift; ct = A.mods.ctrl; A.releaseMods();
        try { el.setPointerCapture(ev.pointerId); } catch (e) { /* ok */ }
        A.ensureAudio();
      });
      el.addEventListener('pointermove', function (ev) {
        if (!active) return;
        acc += ev.clientX - last; last = ev.clientX;
        var n = acc < 0 ? Math.ceil(acc / 9) : Math.floor(acc / 9), s = n < 0 ? -1 : 1, j;
        if (!n) return;
        acc -= n * 9;
        for (j = 0; j < Math.abs(n); ++j) A.key(s < 0 ? K.LEFT : K.RIGHT, sh, ct, j > 0);
        angle += n * 15; spin.setAttribute('transform', 'rotate(' + angle + ')');
      });
      function end() { active = false; }
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('wheel', function (ev) { ev.preventDefault(); A.key(ev.deltaY < 0 ? K.RIGHT : K.LEFT, A.mods.shift, A.mods.ctrl, false); A.releaseMods(); }, { passive: false });
      wheel = el;
      legend('DATA', 408, 868, 124).style.textAlign = 'center';
    }

    // ---------------------------------------------------------------- buttons
    function buildButtons() {
      var x0 = 23, pitch = 70, w = 64, h = 46, i;
      legend('TRANSPORT', x0, 404);
      pbtn('◀◀ REW', x0, 420, w, h, send(K.BACKSPACE, false, false), false);
      pbtn('▶ PLAY', x0 + pitch, 420, w, h, send(K.SPACE, false, false), false, function () { return X().msq_web_state(2); }, 'green');
      pbtn('● REC', x0 + 2 * pitch, 420, w, h, send(F(5), false, false), false, function () { return X().msq_web_state(3); }, 'red');
      pbtn('TEMPO −', x0 + 3 * pitch, 420, w, h, send(K.END, false, false), true);
      pbtn('TEMPO +', x0 + 4 * pitch, 420, w, h, send(K.HOME, false, false), true);
      var sb = pbtn('SHIFT', x0 + 5 * pitch, 420, w, h, function () {}, false);
      sb.classList.add('js-shift');
      sb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); A.toggleMod(true); });
      var cb = pbtn('CTRL', x0 + 6 * pitch, 420, w, h, function () {}, false);
      cb.classList.add('js-ctrl');
      cb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); A.toggleMod(false); });
      pbtn('PANIC', x0 + 7 * pitch, 420, w, h, send(K.ESC, false, false), false).classList.add('warn');

      legend('PAGES', x0, 474);
      [['SOUND', PAGE.SOUND], ['SEQ', PAGE.SEQ], ['SONG', PAGE.SONG], ['NRV8', PAGE.NRV8], ['FX', PAGE.FX]].forEach(function (p, n) {
        pbtn(p[0], x0 + n * pitch, 490, w, h, function () { X().msq_web_page(p[1]); }, false, function () { return X().msq_web_state(0) === p[1]; }, 'amber');
      });
      pbtn('TRACK −', x0 + 5 * pitch, 490, w, h, send(F(3), false, false), false);
      pbtn('TRACK +', x0 + 6 * pitch, 490, w, h, send(F(4), false, false), false);
      pbtn('MUTE', x0 + 7 * pitch, 490, w, h, send(F(6), false, false), false, function () { return X().msq_web_state(8); }, 'red');

      legend('FUNCTIONS', x0, 544);
      for (i = 0; i < 8; ++i) (function (n) {
        var b = mk('div', 'pbtn psoft');
        b.appendChild(mk('span', 'leg', ''));
        b.appendChild(mk('small', 'hint', ''));
        A.press(b, function (r) {
          var s = b._s;
          if (s && (!r || s[4])) A.key(s[1], s[2], s[3], r);
        }, null, true);
        place(b, x0 + (n % 4) * 140, 560 + Math.floor(n / 4) * 52, 134, 46);
        softEls.push(b);
      })(i);
      more = pbtn('MORE ▸', x0, 664, 554, 28, function () {
        var page = X().msq_web_state(0);
        softIdx[page] = (softIdx[page] || 0) + 1;
        refreshSofts(page);
      }, false);
      more.classList.add('more');

      legend('NAVIGATION', x0, 708);
      var cells = [null, ['▲', K.UP], null, ['◀', K.LEFT], ['OK', K.ENTER], ['▶', K.RIGHT], null, ['▼', K.DOWN], null];
      cells.forEach(function (c, n) {
        if (!c) return;
        var sh = false, ct = false;                              // the modifiers latched when it was pressed: held, it repeats with them
        pbtn(c[0], x0 + (n % 3) * 70, 724 + Math.floor(n / 3) * 56, 64, 50, function (r) {
          if (!r) { sh = A.mods.shift; ct = A.mods.ctrl; A.releaseMods(); }
          A.key(c[1], sh, ct, r);
        }, c[1] !== K.ENTER).classList.add('dp');
      });
      pbtn('OCT −', 240, 724, 84, 50, send(K.PGDN, false, false), false);
      pbtn('OCT +', 240, 780, 84, 50, send(K.PGUP, false, false), false);
      buildWheel();
    }

    // the function buttons show the page's shortcuts, eight at a time; MORE turns the set
    function refreshSofts(page) {
      var list = A.SHORT[page] || [], sets = Math.max(1, Math.ceil(list.length / 8)), idx = (softIdx[page] || 0) % sets, i;
      softIdx[page] = idx;
      for (i = 0; i < 8; ++i) {
        var s = list[idx * 8 + i], b = softEls[i];
        b._s = s || null;
        b.classList.toggle('empty', !s);
        b.querySelector('.leg').textContent = s ? s[0] : '';
        b.querySelector('.hint').textContent = s ? s[5] : '';

<script>

  function applyTheme(t) {

  function buildPads() {
    var pads = $('pads'), i;
    for (i = 0; i < 8; ++i) (function (v) {
      var b = mk('button', 'btn pad' + v, VOICE_NAMES[v]);
      b.type = 'button';
      press(b, function () { if (x) x.msq_web_pad(v); }, null, false);
      pads.appendChild(b);
    })(i);
    pads.appendChild(mk('div', 'label', 'STUTTERS — HOLD'));
    for (i = 0; i < 8; ++i) (function (m) {
      var b = mk('button', 'btn stut', STUTTER_NAMES[m - 1]);
      b.type = 'button';
      press(b, function () { if (x) x.msq_web_stutter(m); }, function () { if (x) x.msq_web_stutter(0); }, false);
      pads.appendChild(b);
    })(i + 1);
  }

  // what follows the engine: the page tabs, the transport lights, which panel is shown
  function sync() {
    var page = x.msq_web_state(0), playing = x.msq_web_state(2), rec = x.msq_web_state(3);
    if (page !== shownPage) {
      shownPage = page;
      var tabs = $('pages').children, i;
      for (i = 0; i < tabs.length; ++i) tabs[i].classList.toggle('tab-active', +tabs[i].dataset.page === page);
      buildShortcuts(page);
      var drums = page === PAGE.NRV8 || page === PAGE.FX;
      $('pads').style.display = drums ? 'grid' : 'none';
      $('piano').style.display = drums ? 'none' : 'flex';
      $('pianobar').style.display = drums ? 'none' : 'grid';
    }
    $('btnPlay').classList.toggle('live', !!playing);
    $('btnPlay').textContent = playing ? '■' : '▶';
    $('btnRec').classList.toggle('rec', !!rec);
    $('octlabel').textContent = 'KEYS FROM C' + x.msq_web_state(1);
  }

  // ------------------------------------------------------------------ the PC keyboard
  var PIANO = {                                                  // KeyboardEvent.code (a position on the keyboard, whatever the layout) -> semitones
    KeyZ: 0, KeyS: 1, KeyX: 2, KeyD: 3, KeyC: 4, KeyV: 5, KeyG: 6, KeyB: 7, KeyH: 8, KeyN: 9, KeyJ: 10, KeyM: 11, Comma: 12, KeyL: 13, Period: 14, Semicolon: 15, Slash: 16,
    KeyQ: 12, Digit2: 13, KeyW: 14, Digit3: 15, KeyE: 16, KeyR: 17, Digit5: 18, KeyT: 19, Digit6: 20, KeyY: 21, Digit7: 22, KeyU: 23, KeyI: 24, Digit9: 25, KeyO: 26, Digit0: 27, KeyP: 28
  };
  var COMMANDS = { ArrowUp: K.UP, ArrowDown: K.DOWN, ArrowLeft: K.LEFT, ArrowRight: K.RIGHT, Enter: K.ENTER, Delete: K.DELETE, Insert: K.INSERT, Tab: K.TAB,
                   Escape: K.ESC, Backspace: K.BACKSPACE, Space: K.SPACE, Home: K.HOME, End: K.END, PageUp: K.PGUP, PageDown: K.PGDN };
  var heldKey = {};                                              // code -> note

  function onKeyDown(ev) {
    if (!x) return;
    var ctrl = ev.ctrlKey || ev.metaKey, code = ev.code, k;
    if (ctrl && code === 'KeyS') { ev.preventDefault(); if (!ev.repeat) saveFile(); return; }
    if (ctrl && code === 'KeyO') { ev.preventDefault(); if (!ev.repeat) $('file').click(); return; }
    if (!ctrl && PIANO.hasOwnProperty(code)) {
      ev.preventDefault();
      if (ev.repeat || heldKey[code] !== undefined) return;
      ensureAudio();
      heldKey[code] = noteFor(PIANO[code]);
      x.msq_web_note(heldKey[code], 1);
      return;
    }
    k = COMMANDS[code];
    if (!k && /^F([1-9]|1[01])$/.test(code)) k = F(+code.slice(1));
    if (k) { ev.preventDefault(); key(k, ev.shiftKey, ctrl, ev.repeat); }
  }

  function onKeyUp(ev) {
    if (!x || heldKey[ev.code] === undefined) return;
    x.msq_web_note(heldKey[ev.code], 0);
    delete heldKey[ev.code];
  }

  function releaseAll() {
    var c;
    for (c in heldKey) if (heldKey.hasOwnProperty(c)) { x.msq_web_note(heldKey[c], 0); delete heldKey[c]; }
  }

  // ------------------------------------------------------------------ project files
  function projectBytes(quiet) {
    var len = x.msq_web_save(quiet ? 1 : 0);
    return len > 0 ? new Uint8Array(mem(), x.msq_web_file(), len).slice() : null;
  }

  function autosave() {
    if (!x) return;
    try {
      var b = projectBytes(true);
      if (b) window.localStorage.setItem(AUTOSAVE_KEY, bytesToB64(b));
    } catch (e) { /* private mode, or full: the download still works */ }
  }

  function restore() {
    try {
      var s = window.localStorage.getItem(AUTOSAVE_KEY);
      if (!s) return;
      var b = b64ToBytes(s);
      if (b.length > x.msq_web_file_max()) return;
      new Uint8Array(mem(), x.msq_web_file(), b.length).set(b);
      x.msq_web_load(b.length);                                  // refused if damaged: the demo stays
    } catch (e) { /* no storage */ }
  }

  function stamp() {
    var d = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return 'msq8-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
  }

  // A browser download of `bytes` (a normal page). `name` ends in .msq8.
  function browserDownload(bytes, name) {
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' })), a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

  // SAVE FILE. A page inside the claude.ai viewer cannot start a download itself: it asks the viewer through the
  // `downloads` capability, which takes a short list of extensions, so there the project goes as a .txt holding the
  // same code COPY CODE gives. LOAD FILE reads both.
  function saveFile() {
    var claude = window.claude;
    if (claude && typeof claude.use === 'function') {
      claude.use('downloads').then(function (dl) {
        if (!dl) { plainSave(); return; }
        var code = projectCode();
        if (!code) return;
        dl.save({ filename: stamp() + '.txt', data: code }).then(autosave, function (e) {
          if (!e || e.code !== 'declined') x.msq_web_message(4);       // not a refusal: the code box is the way out
          if (!e || e.code !== 'declined') { $('pastebox').hidden = false; $('code').value = code; }
        });
      }, plainSave);
      return;
    }
    plainSave();
  }

  function plainSave() {
    var b = projectBytes(false);
    if (!b) return;
    browserDownload(b, stamp() + '.msq8');
    autosave();
  }

  // a project in memory (a file, a pasted code): into the engine
  function loadBytes(b) {
    if (!b || b.length < 12 || b.length > x.msq_web_file_max()) { x.msq_web_message(1); return false; }
    new Uint8Array(mem(), x.msq_web_file(), b.length).set(b);
    if (x.msq_web_load(b.length) !== 0) return false;
    autosave();
    return true;
  }

  function loadFile(file) {
    var rd = new FileReader();
    rd.onload = function () {
      var b = new Uint8Array(rd.result);
      if (b.length > 5 && b[0] === 77 && b[1] === 83 && b[2] === 81 && b[3] === 56 && b[4] !== 58) loadBytes(b);              // "MSQ8" and a version: the binary file
      else loadBytes(codeToBytes(typeof TextDecoder !== 'undefined' ? new TextDecoder().decode(b) : String.fromCharCode.apply(null, b)));   // the text code, in a .txt
    };
    rd.onerror = function () { x.msq_web_message(1); };
    rd.readAsArrayBuffer(file);
  }

  // A project as text: the same bytes in base64, with a tag in front. It travels through any chat or note, and a
  // page that cannot save files (a sandboxed one) can still keep a project this way.
  var CODE_TAG = 'MSQ8:';

  function projectCode() {
    var b = projectBytes(false);
    return b ? CODE_TAG + bytesToB64(b) : '';
  }

  function codeToBytes(text) {
    var t = String(text).replace(/\s+/g, '');
    if (t.indexOf(CODE_TAG) === 0) t = t.slice(CODE_TAG.length);
    if (!t || /[^A-Za-z0-9+\/=]/.test(t)) return null;
    try { return b64ToBytes(t); } catch (e) { return null; }
  }

  function wireFiles() {
    var input = $('file'), newBtn = $('btnNew'), armed = 0, box = $('pastebox'), area = $('code');
    $('btnSave').addEventListener('click', function () { ensureAudio(); saveFile(); });
    $('btnLoad').addEventListener('click', function () { input.value = ''; input.click(); });
    input.addEventListener('change', function () { if (input.files && input.files[0]) loadFile(input.files[0]); });

    $('btnCopy').addEventListener('click', function () {
      var code = projectCode();
      if (!code) return;
      function manual() {                                        // no clipboard here: the code in a box, selected, to copy by hand
        box.hidden = false; area.value = code; area.focus(); area.select();
        x.msq_web_message(4);
      }
      try {
        window.navigator.clipboard.writeText(code).then(function () { x.msq_web_message(3); }, manual);
      } catch (e) { manual(); }
    });
    $('btnPaste').addEventListener('click', function () { box.hidden = !box.hidden; if (!box.hidden) { area.value = ''; area.focus(); } });
    $('btnCodeLoad').addEventListener('click', function () {
      if (loadBytes(codeToBytes(area.value))) { box.hidden = true; area.value = ''; }
      else if (!codeToBytes(area.value)) x.msq_web_message(1);
    });

    newBtn.addEventListener('click', function () {
      ensureAudio();
      if (!armed) {                                              // two taps: a new project loses the one in the machine
        armed = setTimeout(function () { armed = 0; newBtn.textContent = 'NEW'; newBtn.classList.remove('warn'); }, 3000);
        newBtn.textContent = 'SURE?'; newBtn.classList.add('warn');
        return;
      }
      clearTimeout(armed); armed = 0;
      newBtn.textContent = 'NEW'; newBtn.classList.remove('warn');
      try { window.localStorage.removeItem(AUTOSAVE_KEY); } catch (e) { /* ok */ }
      releaseAll();
      x.msq_web_init(((Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0) || 1);
      x.msq_web_message(0);
    });
  }

  // ------------------------------------------------------------------ start
  function start() {
    addScreen($('screen'));
    buildFixed(); buildPiano(); buildPads(); wireFiles();
    $('start').addEventListener('pointerdown', function (ev) { ev.preventDefault(); ensureAudio(); });
    $('btnTheme').addEventListener('click', function () { if (x) applyTheme(storedTheme() + 1 >= 2 ? 0 : storedTheme() + 1); });
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', function () { if (x) releaseAll(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) autosave(); });
    window.addEventListener('pagehide', autosave);
    setInterval(autosave, 8000);
    boot().then(function () { window.requestAnimationFrame(draw); }).catch(function (e) {
      var st = document.querySelectorAll('.js-start'), si;
      for (si = 0; si < st.length; ++si) { st[si].classList.remove('hidden'); st[si].textContent = 'COULD NOT START: ' + (e && e.message ? e.message : e); }
    });
    window.msq = { K: K, F: F, PAGE: PAGE, exports: function () { return x; } };   // for the console
    window.msqApp = {                                                              // what the panel view (panel.js) builds on
      K: K, F: F, PAGE: PAGE, VOICE_NAMES: VOICE_NAMES, STUTTER_NAMES: STUTTER_NAMES, SHORT: SHORT, mods: mods, WHITE: WHITE, BLACK: BLACK,
      $: $, mk: mk, press: press, key: key, attachKey: attachKey, toggleMod: toggleMod, releaseMods: releaseMods, addScreen: addScreen,
      exports: function () { return x; }, mem: mem, ensureAudio: ensureAudio, onFrame: function (fn) { frameHooks.push(fn); }
    };
    if (window.msqPanelInit) window.msqPanelInit(window.msqApp);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
}());

</script>
</body>
</html>
